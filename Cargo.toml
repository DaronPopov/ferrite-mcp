[workspace]
resolver = "2"
members = [
    "crates/shell-core",
    "crates/shell-lexer",
    "crates/shell-parser",
    "crates/shell-runtime",
    "crates/shell-hooks",
    "crates/shell-tui",
    "crates/shell-mcp",
    "crates/shell-bin",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = []
license     = "MIT"
repository  = ""

# Shared dependency versions — crates reference these via workspace = true
[workspace.dependencies]
shell-core    = { path = "crates/shell-core" }
shell-lexer   = { path = "crates/shell-lexer" }
shell-parser  = { path = "crates/shell-parser" }
shell-runtime = { path = "crates/shell-runtime" }
shell-hooks   = { path = "crates/shell-hooks" }
shell-tui     = { path = "crates/shell-tui" }
shell-mcp     = { path = "crates/shell-mcp" }

thiserror  = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = { version = "1", features = ["serde"] }
glob       = "0.3"
regex      = { version = "1", default-features = false, features = ["std"] }
nix        = { version = "0.29", features = ["process", "signal", "fs", "term"] }
libc       = "0.2"
crossterm  = "0.28"
anyhow     = "1"

# ── Profiles ────────────────────────────────────────────────────────────────

[profile.release]
opt-level     = "z"   # minimize binary size
lto           = true  # link-time optimization
codegen-units = 1     # single codegen unit for maximum optimization
strip         = true  # strip symbols from binary
panic         = "abort"

[profile.dev]
opt-level = 0
debug     = true
