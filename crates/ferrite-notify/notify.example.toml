# ferrite-notify config — copy to ~/.config/ferrite/notify.toml
# All sections are optional. Add as many backends as you want.

# ── Machine display name ──────────────────────────────────────────────────────
[machine]
name = ""  # leave blank to use system hostname

# ── SMTP backends (any provider) ──────────────────────────────────────────────
# You can have multiple [[smtp]] blocks to fan out to different providers.

[[smtp]]
label    = "gmail"
host     = "smtp.gmail.com"
port     = 587          # 587 = STARTTLS, 465 = implicit TLS
starttls = true
user     = "you@gmail.com"
password = "your-app-password"   # Gmail: myaccount.google.com → App Passwords
from     = "ferrite <you@gmail.com>"
to       = ["you@gmail.com"]     # multiple recipients supported

# [[smtp]]
# label    = "outlook"
# host     = "smtp.office365.com"
# port     = 587
# starttls = true
# user     = "you@outlook.com"
# password = "your-password"
# from     = "ferrite <you@outlook.com>"
# to       = ["you@outlook.com", "team@example.com"]

# [[smtp]]
# label    = "sendgrid"
# host     = "smtp.sendgrid.net"
# port     = 587
# starttls = true
# user     = "apikey"
# password = "SG.your-api-key"
# from     = "ferrite <no-reply@yourdomain.com>"
# to       = ["you@example.com"]

# ── ntfy.sh backends ──────────────────────────────────────────────────────────
# Phone push notifications. Subscribe at ntfy.sh or self-host.

# [[ntfy]]
# label  = "phone"
# topic  = "my-secret-uuid-topic"   # acts as auth secret — use a UUID
# server = "https://ntfy.sh"        # or your self-hosted URL
# token  = ""                       # optional Bearer token for self-hosted ntfy

# ── Webhook backends ──────────────────────────────────────────────────────────
# POST to any HTTP endpoint. Works with Slack, Discord, custom APIs.

# [[webhook]]
# label        = "slack"
# url          = "https://hooks.slack.com/services/T.../B.../..."
# content_type = "application/json"
# body_template = '{"text":"🖥️ {hostname} is online\nSSH: {ssh}\nTailscale: {ip}\nSession: {session_url}"}'

# [[webhook]]
# label        = "discord"
# url          = "https://discord.com/api/webhooks/..."
# content_type = "application/json"
# body_template = '{"content":"🖥️ **{hostname}** online — `{ssh}` — {session_url}"}'

# [[webhook]]
# label        = "custom"
# url          = "https://your-server.com/notify"
# content_type = "application/json"
# # No body_template = sends full JSON: {hostname, tailscale_ip, ssh, session_url, tmux}
# [webhook.headers]
# Authorization = "Bearer your-token"
