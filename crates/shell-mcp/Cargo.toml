[package]
name        = "shell-mcp"
description = "MCP stdio server — exposes ferrite's machine-intelligence tools to Claude Code"
version.workspace   = true
edition.workspace   = true
authors.workspace   = true
license.workspace   = true

[features]
default = []
fercuda-runtime-apply = ["dep:fercuda_ffi"]

[dependencies]
shell-core = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
glob       = { workspace = true }
regex      = { workspace = true }
nix        = { workspace = true }
libc       = { workspace = true }
fercuda_ffi = { package = "fercuda-ffi", path = "../../../feRcuda/rust/fercuda-ffi", optional = true }
