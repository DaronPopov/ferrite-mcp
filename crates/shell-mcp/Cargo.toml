[package]
name        = "shell-mcp"
description = "MCP stdio server — exposes ferrite's machine-intelligence tools to Claude Code"
version.workspace   = true
edition.workspace   = true
authors.workspace   = true
license.workspace   = true

[dependencies]
shell-core = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
glob       = { workspace = true }
regex      = { workspace = true }
nix        = { workspace = true }
libc       = { workspace = true }
quick-xml  = { version = "0.38", features = ["serialize"] }

# Determinism layer — walker, search, reads, mutations, hashing.
# These replace hand-rolled walkers and unlock the mutation surface.
ignore        = "0.4"
globset       = "0.4"
grep-searcher = "0.1"
grep-matcher  = "0.1"
grep-regex    = "0.1"
bstr          = "1"
memmap2       = "0.9"
encoding_rs   = "0.8"
tempfile      = "3"
fs2           = "0.4"
rayon         = "1"
blake3        = { version = "1", features = ["pure"] }
similar       = "2"

[dev-dependencies]
tempfile = "3"
